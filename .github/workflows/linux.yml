name: Windows and Linux builds

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 xvfb xauth fakeroot dpkg-dev
      - name: Check source and core logic
        run: |
          /usr/bin/python3 -m py_compile linux/worktimer
          /usr/bin/python3 linux/test-core.py
          /usr/bin/python3 linux/test-updates.py
          bash -n linux/build-deb.sh
      - name: Build and install Debian package
        run: |
          bash linux/build-deb.sh
          test "$(dpkg-deb -f linux/build/worktimer_1.4.2_all.deb Package)" = worktimer
          test "$(dpkg-deb -f linux/build/worktimer_1.4.2_all.deb Version)" = 1.4.2
          sudo apt-get install -y ./linux/build/worktimer_1.4.2_all.deb
      - name: Smoke test installed application and hotkey command
        run: |
          timeout 90s xvfb-run -a bash linux/test-gui.sh
          timeout 90s xvfb-run -a /usr/bin/python3 linux/test-projects-gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: worktimer-linux-deb
          path: linux/build/worktimer_1.4.2_all.deb
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check independent timers and persistence
        shell: powershell
        run: |
          ./tests/run.ps1
          ./tests/run-updater.ps1
      - name: Build Windows executable
        shell: cmd
        run: build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: worktimer-windows-exe
          path: WorkTimer.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish tested Windows and Linux builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f release-assets/WorkTimer.exe
          test -f release-assets/worktimer_1.4.2_all.deb
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag \
            --title "WorkTimer $GITHUB_REF_NAME" --notes-file CHANGELOG.md
